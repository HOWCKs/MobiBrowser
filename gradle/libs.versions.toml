[versions]
# Stack: Kotlin + Jetpack Compose (Material 3) + GeckoView. Sem React, sem JS bridge.
# Decisão do plano (set/2026): toolchain novo — AGP 9 + Gradle 9.6/9.7 + API 37 — para usar
# o Material 3 atual, e GeckoView no canal NIGHTLY para poder instalar extensão não assinada
# (o release do motor recusa add-on sem assinatura da Mozilla, o que limitaria o pacote do
# Chrome Web Store ao modo de compatibilidade).
agp = "9.3.2"
kotlin = "2.4.20"
composeBom = "2026.09.00"

# Motor de navegação: GeckoView (runtime real de WebExtensions, declarativeNetRequest, popups).
#
# geckoviewChannel = "nightly"  ->  artifact omni nightly + `xpinstall.signatures.required`
#       desligado por config do motor: é o único canal onde um pacote convertido do Chrome
#       Web Store pode ser instalado sem assinatura da Mozilla. Há build novo por dia, por
#       isso a versão é dinâmica (158.+ = o nightly mais recente do ciclo).
# geckoviewChannel = "release"  ->  motor estável e congelado; extensões não assinadas são
#       recusadas e o app usa o modo de compatibilidade (MobiBridge) para elas.
# Trocar o canal é mudar ESTA linha; o buildConfigField MOBI_ALLOW_UNSIGNED_ADDONS acompanha.
geckoviewChannel = "nightly"
geckoview = "158.+"
geckoviewRelease = "155.0.20260903215306"

coreKtx = "1.13.1"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
datastore = "1.1.1"
coroutines = "1.9.0"
junit = "4.13.2"
# Implementação real de org.json: dentro de testes JVM o android.jar só expõe stubs
# que lançam "not mocked", e o conversor de manifest é todo em JSONObject.
json = "20240303"

[libraries]
# "omni" = recorte do GeckoView com todas as features do navegador (é o que o Firefox Android
# usa via android-components); o recorte enxuto não traz partes do runtime de extensões.
geckoview-nightly = { module = "org.mozilla.geckoview:geckoview-omni-nightly", version.ref = "geckoview" }
geckoview-release = { module = "org.mozilla.geckoview:geckoview-omni", version.ref = "geckoviewRelease" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-window = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android e kotlin-compose deliberadamente NÃO existem mais: desde o AGP 9 o Kotlin é
# built-in (aplicar org.jetbrains.kotlin.android falha o build). `kotlin` abaixo fica só como
# referência da versão do compilador que o toolchain espera (Kotlin 2.4 <-> AGP 9, R8 9.1.29+).
