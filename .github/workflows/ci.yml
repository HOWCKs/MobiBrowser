name: CI — APK instável

# Todo push e toda PR geram um APK de pré-lançamento. Não há etapa de QA antes:
# o artefato é instalado no aparelho e o feedback volta como issue.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type a compilar"
        required: false
        default: "unstable"
        type: choice
        options: ["unstable", "debug", "release"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK (${{ github.event.inputs.build_type || 'unstable' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checar out
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache de dependências)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lógica pura (conversor de manifest, parser de CRX)
        run: |
          set -o pipefail
          # AGP 9 cria componentes de teste unitário só para o tested build type (debug),
          # então `testUnstableUnitTest` não existe mais — o que importa é o :app:test*.
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest --stacktrace \
            2>&1 | tee /tmp/gradle-test.log

      - name: Compilar APKs (universal + por ABI)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            assemble${{ github.event.inputs.build_type || 'unstable' }} --stacktrace \
            2>&1 | tee /tmp/gradle-apk.log

      # Erros de compilação viram anotações: dá para lê-los pela API de checks e eles
      # aparecem no diff da PR, em vez de enterrados em 4 mil linhas de stack trace.
      - name: Publicar erros como anotações
        if: failure()
        run: python3 tools/ci-annotate.py /tmp/gradle-test.log /tmp/gradle-apk.log

      - name: Publicar relatório de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      # Log bruto + superfície real de API do AAR do motor, num artefato só para diagnóstico:
      # anotação do GitHub tem teto (50 por check run) e aqui não há limite. Lê-se com
      #   gh run download <run> -n mobibrowser-diagnostico-<sha> -d /tmp/diag
      - name: Juntar diagnóstico (log bruto + javap do GeckoView)
        if: always()
        run: |
          mkdir -p app/build/reports /tmp/gv
          cp /tmp/gradle-test.log app/build/reports/gradle-test.log 2>/dev/null || true
          cp /tmp/gradle-apk.log app/build/reports/gradle-apk.log 2>/dev/null || true
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview -name '*.aar' 2>/dev/null | head -1)
          {
            echo "# GeckoView: ${AAR:-nenhum AAR resolvido}"
            if [ -n "$AAR" ]; then
              unzip -o -q "$AAR" classes.jar -d /tmp/gv
              for c in GeckoRuntime GeckoRuntimeSettings GeckoSession WebExtension \
                       WebExtensionController StorageController GeckoResult GeckoView; do
                names=$(unzip -Z1 /tmp/gv/classes.jar "org/mozilla/geckoview/${c}.class" \
                        "org/mozilla/geckoview/${c}\$*.class" 2>/dev/null \
                        | sed 's#^org/mozilla/geckoview/##; s#\.class$##')
                for n in $names; do
                  echo
                  echo "===== org.mozilla.geckoview.$n ====="
                  javap -protected -cp /tmp/gv/classes.jar "org.mozilla.geckoview.$n" 2>&1
                done
              done
            fi
          } > app/build/reports/geckoview-api.txt
          wc -l app/build/reports/geckoview-api.txt

      - name: Publicar diagnóstico do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobibrowser-diagnostico-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## APKs gerados"
            echo ""
            echo "| arquivo | tamanho |"
            echo "|---|---|"
            find app/build/outputs/apk -name '*.apk' -printf '%P\t%s\n' 2>/dev/null \
              | awk -F'\t' '{ printf "| %s | %.1f MB |\n", $1, $2/1024/1024 }'
            echo ""
            echo "Commit curto: \`${GITHUB_SHA:0:7}\` (aparece em Configurações → Sobre no app)."
            echo ""
            echo "Artefato **instável**: assinatura de debug, sem ofuscação, logcat do motor ligado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato instável
        uses: actions/upload-artifact@v4
        with:
          name: mobibrowser-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
