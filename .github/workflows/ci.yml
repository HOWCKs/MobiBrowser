name: CI — APK instável

# Todo push e toda PR geram um APK de pré-lançamento. Não há etapa de QA antes:
# o artefato é instalado no aparelho e o feedback volta como issue.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type a compilar"
        required: false
        default: "unstable"
        type: choice
        options: ["unstable", "debug", "release"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write é para o passo que move a tag `nightly` e publica a release de
  # pré-lançamento que o app consulta em Configurações → Sobre.
  contents: write

jobs:
  # A etapa de teste dentro do job do APK é deliberadamente "continue-on-error": o veredito do
  # projeto vem do aparelho, e um APK instável tem de sair mesmo com lógica vermelha. O preço dessa
  # folga apareceu agora — um arquivo de teste com erro de sintaxe ficou vários runs sem ninguém
  # notar, porque anotação no diff da PR não barra nada. Este job fecha a brecha: mesmo comando,
  # sem a folga. Fica vermelho, o job do APK continua publicando do mesmo jeito.
  testes:
    name: Lógica pura (vermelho aparece no run, não segura o APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checar out
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache de dependências)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Rodar os testes JVM
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest --stacktrace

      # Sem isto, um run vermelho diria só "falhou" e a pilha ficaria a 3 mil linhas de distância.
      - name: Publicar resumo dos testes
        if: failure()
        run: |
          {
            echo '### Testes JVM vermelhos'
            echo
            echo '```'
            # Só o que falhou: o <testcase> que tem um <failure> filho, com a mensagem.
            find app/build/test-results -name 'TEST-*.xml' -exec awk '
              /<testcase/ { caso = $0 }
              /<failure/ { gsub(/^ *| *$/, "", caso); print caso; print substr($0, 1, 400) }
            ' {} \; 2>/dev/null | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: Compilar APK (${{ github.event.inputs.build_type || 'unstable' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checar out
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (com cache de dependências)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # O compilador insiste em não ver data/BrowserDb.kt e core/ext/MatchPattern.kt (todos os
      # imports deles dão "Unresolved reference" sem erro nos próprios arquivos). Publico o
      # estado do checkout como anotação para saber se o problema é o checkout ou o source set.
      - name: Conferir o checkout (diagnóstico)
        run: |
          D=app/src/main/kotlin/app/mobibrowser
          {
            echo "ls-tree BrowserDb: $(git ls-tree HEAD -- $D/data/BrowserDb.kt)"
            echo "ls-tree MatchPattern: $(git ls-tree HEAD -- $D/core/ext/MatchPattern.kt)"
            echo "worktree: $(ls -la $D/data/BrowserDb.kt $D/core/ext/MatchPattern.kt 2>&1 | tr -s ' ' | tr '\n' ';')"
            echo "md5: $(md5sum $D/data/BrowserDb.kt $D/core/ext/MatchPattern.kt 2>&1 | awk '{printf "%s ", $1}')"
            echo "arquivos kt no módulo: $(find app/src -name '*.kt' | wc -l)"
            echo "source set main: $(find app/src/main/kotlin -name '*.kt' | sort | tr '\n' ' ' | cut -c1-900)"
          } | tee /tmp/checkout-check.txt
          python3 - <<'PY'
          import io
          t = io.open('/tmp/checkout-check.txt', encoding='utf-8', errors='replace').read()
          print('::warning::' + t.replace('%', '%25').replace(':', '%3A').replace('|', '%7C').replace('\n', '%0A')[:1400])
          PY

      # Guarda barata contra o bug que custou 4 ciclos: um `/*` dentro de KDoc (todo match
      # pattern tem `://*`) aninha comentário no Kotlin e engole o arquivo inteiro — o
      # compilador não acusa nada no arquivo, só "Unresolved reference" nos outros.
      - name: Checar comentários de bloco no Kotlin
        run: python3 tools/kotlin-comment-check.py app/src

      # O mesmo tipo de acidente, coberto por baixo: uma chave perdida num `when` dentro de
      # `"""`/comentário faz o compilador acusar erros em arquivos que estão certos. O verificador
      # é disparado contra um erro plantado em cada rodada de revisão e precisa pegar o plantado —
      # teste de duas pontas, porque um checador que sempre diz "ok" não vale nada.
      - name: Checar balanceamento de chaves no Kotlin
        run: python3 tools/kotlin-balance-check.py app/src

      # Um buildConfigField cortado por engano não gera erro no gradle: gera oito
      # "Unresolved reference" em arquivos aleatórios do app, que é exatamente o que aconteceu
      # quando o GIT_SHA sumiu da lista. Custa um grep e economiza um ciclo de 12 minutos.
      - name: Conferir campos do BuildConfig
        run: |
          for field in GIT_SHA GECKOVIEW_VERSION GECKOVIEW_CHANNEL CWS_PRODVERSION UPDATE_REPO UPDATE_TAG; do
            if ! grep -q "\"$field\"" app/build.gradle.kts; then
              echo "::error::app/build.gradle.kts não declara buildConfigField \"$field\" — linha cortada na edição"
              exit 1
            fi
          done

      - name: Lógica pura (conversor de manifest, parser de CRX)
        # Teste unitário vermelho NÃO segura mais o APK: neste projeto o veredito vem do
        # aparelho (feedback depois de instalar), e o que importa é o artefato sair. A falha
        # continua publicada como anotação e no sumário do run.
        continue-on-error: true
        run: |
          set -o pipefail
          # AGP 9 cria componentes de teste unitário só para o tested build type (debug),
          # então `testUnstableUnitTest` não existe mais — o que importa é o :app:test*.
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest --stacktrace \
            2>&1 | tee /tmp/gradle-test.log

      - name: Compilar APKs (universal + por ABI)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            assemble${{ github.event.inputs.build_type || 'unstable' }} --stacktrace \
            2>&1 | tee /tmp/gradle-apk.log

      # Erros de compilação viram anotações: dá para lê-los pela API de checks e eles
      # aparecem no diff da PR, em vez de enterrados em 4 mil linhas de stack trace.
      - name: Publicar erros como anotações
        if: always()
        run: python3 tools/ci-annotate.py /tmp/gradle-test.log /tmp/gradle-apk.log

      - name: Publicar relatório de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      # Log bruto + superfície real de API do AAR do motor, num artefato só para diagnóstico:
      # anotação do GitHub tem teto (50 por check run) e aqui não há limite. Lê-se com
      #   gh run download <run> -n mobibrowser-diagnostico-<sha> -d /tmp/diag
      - name: Juntar diagnóstico (log bruto + javap do GeckoView)
        if: always()
        run: |
          mkdir -p app/build/reports /tmp/gv
          cp /tmp/gradle-test.log app/build/reports/gradle-test.log 2>/dev/null || true
          cp /tmp/gradle-apk.log app/build/reports/gradle-apk.log 2>/dev/null || true
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview -name '*.aar' 2>/dev/null | head -1)
          {
            echo "# GeckoView: ${AAR:-nenhum AAR resolvido}"
            if [ -n "$AAR" ]; then
              unzip -o -q "$AAR" classes.jar -d /tmp/gv
              for c in GeckoRuntime GeckoRuntimeSettings GeckoSession WebExtension \
                       WebExtensionController StorageController GeckoResult GeckoView; do
                names=$(unzip -Z1 /tmp/gv/classes.jar "org/mozilla/geckoview/${c}.class" \
                        "org/mozilla/geckoview/${c}\$*.class" 2>/dev/null \
                        | sed 's#^org/mozilla/geckoview/##; s#\.class$##')
                for n in $names; do
                  echo
                  echo "===== org.mozilla.geckoview.$n ====="
                  javap -protected -cp /tmp/gv/classes.jar "org.mozilla.geckoview.$n" 2>&1
                done
              done
            fi
          } > app/build/reports/geckoview-api.txt
          wc -l app/build/reports/geckoview-api.txt

      - name: Publicar diagnóstico do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobibrowser-diagnostico-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## APKs gerados"
            echo ""
            echo "| arquivo | tamanho |"
            echo "|---|---|"
            find app/build/outputs/apk -name '*.apk' -printf '%P\t%s\n' 2>/dev/null \
              | awk -F'\t' '{ printf "| %s | %.1f MB |\n", $1, $2/1024/1024 }'
            echo ""
            echo "Commit curto: \`${GITHUB_SHA:0:7}\` (aparece em Configurações → Sobre no app)."
            echo ""
            echo "Artefato **instável**: assinatura de debug, sem ofuscação, logcat do motor ligado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Separar os APKs para download
        run: |
          # O universal é a soma de todas as ABIs (~3x o tamanho) e quase ninguém precisa dele:
          # quem instala à mão escolhe o split do aparelho. Ele continua no build, só não no
          # artefato — 589 MB de download no celular não é um loop de feedback razoável.
          mkdir -p dist/apks dist/apks-arm64
          find app/build/outputs/apk -name '*.apk' ! -name '*universal*' -exec cp {} dist/apks/ \;
          for f in dist/apks/*.apk; do
            nome=$(basename "$f" | tr 'A-Z' 'a-z')
            case "$nome" in
              *arm64*v8a*) cp "$f" dist/apks-arm64/ ;;
            esac
          done
          if [ -z "$(ls -A dist/apks-arm64)" ]; then
            # Se o AGP mudou o padrão de nome dos splits, isto me diz os nomes reais sem eu
            # precisar caçar no log (o log do Actions não é acessível daqui).
            echo "::error::nenhum APK de arm64 em dist/apks — nomes: $(ls dist/apks | tr '\n' ' ')"
            exit 1
          fi
          {
            echo "## APKs instáveis (prontos para instalar)"
            echo ""
            echo "| arquivo | tamanho | ABI |"
            echo "|---|---|---|"
            for f in dist/apks/*.apk; do
              sz=$(stat -c %s "$f")
              n=$(basename "$f" | tr 'A-Z' 'a-z')
              case "$n" in
                *arm64*) abi="arm64-v8a (o do seu aparelho)" ;;
                *v7a*) abi="armeabi-v7a (aparelhos ~2014-2017)" ;;
                *x86_64*) abi="x86_64 (emulador/Chromebook)" ;;
                *) abi="?" ;;
              esac
              echo "| \`$(basename "$f")\` | $((sz/1048576)) MB | $abi |"
            done
            echo ""
            echo "Artefato \`mobibrowser-apk-arm64-<sha>\`: só o de arm64, ~120 MB. Se der"
            echo "\`INSTALL_FAILED_NO_MATCHING_ABIS\`, é o caso raro (x86) — me avise que eu"
            echo "publico o universal."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/apks dist/apks-arm64

      # Artefato só com o arm64: é o que se instala num aparelho moderno, e baixar 120 MB em
      # vez de 344 MB é a diferença entre um loop de feedback de 2 minutos e um de 15.
      # Um APK que compila e não abre é a pior falha possível neste projeto (não há QA antes
      # de instalar): o veredito é "tem uma activity lançável?", e isso o aapt2 sabe dizer.
      - name: Exigir activity lançável no APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort | tail -1)
          [ -n "$AAPT" ] || AAPT=$(find ~/.gradle -name 'aapt2' -type f 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 não encontrado — checagem do lançador pulada"
            exit 0
          fi
          for f in dist/apks/*.apk; do
            if "$AAPT" dump badging "$f" | grep -q "launchable-activity: name='app.mobibrowser.MainActivity'"; then
              echo "ok: $(basename "$f") tem activity de lançamento"
            else
              echo "::error::$(basename "$f") NÃO tem launchable-activity — o app instala mas ninguém consegue abrir"
              "$AAPT" dump badging "$f" | head -20
              exit 1
            fi
          done

      - name: Publicar APK arm64 (o do seu aparelho)
        uses: actions/upload-artifact@v4
        with:
          name: mobibrowser-apk-arm64-${{ github.sha }}
          # Diretório, não glob: o nome exato do split é decisão do AGP e mudou uma vez.
          path: dist/apks-arm64
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Publicar artefato instável
        uses: actions/upload-artifact@v4
        with:
          name: mobibrowser-apk-${{ github.sha }}
          path: dist/apks/*.apk
          if-no-files-found: error
          # Os .apk já são ZIPs comprimidos; nivel 1 evita queimar minuto do runner.
          compression-level: 1
          retention-days: 7

      # Este é o ponto do loop de feedback: cada push verde renova a release `nightly`, e o
      # MobiBrowser oferece esse build em Configurações → Sobre → Verificar atualização.
      # Por que não deixar só para o nightly.yml: o GitHub só dispara schedule e
      # workflow_dispatch a partir de arquivos que existem na branch padrão — enquanto o
      # trabalho estiver em outra branch, o cron é enfeite. Publicar daqui não recompila nada:
      # reaproveita os APKs que este job acabou de produzir.
      - name: Renovar o canal de atualização (release nightly)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          (cd dist/apks && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "Build automático do CI — **artefato instável**: não use para senhas ou banco."
            echo ""
            echo "No aparelho, instale o APK da sua ABI (app-arm64-v8a-unstable.apk é o mais"
            echo "comum nos celulares atuais). Se o MobiBrowser já estiver instalado, a atualização"
            echo "também acontece por dentro dele: Configurações, Sobre, Verificar atualização."
            echo ""
            echo "### O que mudou"
            git log -15 --pretty=format:'- %h %s' || true
            echo ""
          } > RELEASE_NOTES.md
          # O app compara o sha do TÍTULO com BuildConfig.GIT_SHA, então mover a tag é cosmético
          # para o verificador; se o push da tag falhar (proteção de branch, por exemplo), o
          # release continua correto e o aviso abaixo explica o que não aconteceu.
          if ! git tag -f nightly "$GITHUB_SHA" >/dev/null 2>&1 || \
             ! git push -f origin refs/tags/nightly >/dev/null 2>&1; then
            echo "::warning::não consegui mover a tag nightly; a release foi atualizada do mesmo jeito"
          fi
          TITLE="MobiBrowser nightly $DATE ($SHA_SHORT)"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease
            gh release upload nightly dist/apks/*.apk dist/apks/SHA256SUMS.txt --clobber
          else
            gh release create nightly dist/apks/*.apk dist/apks/SHA256SUMS.txt \
              --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease --target "$GITHUB_SHA"
          fi
          gh release view nightly --json tagName,name,assets \
            --jq '"canal: " + .name + " · " + (.assets | length | tostring) + " arquivos"' \
            >> "$GITHUB_STEP_SUMMARY"
